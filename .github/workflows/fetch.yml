name: Fetch FPL league

# Twice every morning, plus a "Run workflow" button on the Actions tab.
# GitHub starts scheduled runs late (often one to three hours), so the first run is early and the
# second catches a gameweek FPL marks final mid-morning. The Claude refresh task runs at 11:23 London
# time, after both, and waits up to an hour if today's data still hasn't arrived.
# The button can fetch a past gameweek into its own file (leave it blank for the normal fetch).
on:
  schedule:
    - cron: "47 4 * * *"
    - cron: "47 8 * * *"
  workflow_dispatch:
    inputs:
      gw:
        description: "Past gameweek to fetch into data/fpl_bundle_gwN.json (blank = normal fetch)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the league
        env:
          GW: ${{ github.event.inputs.gw }}
        run: |
          if [ -n "$GW" ]; then
            python fpl_fetch.py --gw "$GW" --out "data/fpl_bundle_gw$GW.json"
          else
            python fpl_fetch.py
          fi

      - name: Save the data
        run: |
          git config user.name "fpl-bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "League data $(date -u +%Y-%m-%d)"
            git pull --rebase -q
            git push
          fi
